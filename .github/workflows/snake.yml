# Builds the animated contribution graph (light + dark) used in README.md
name: Animated contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#4285F4&color_dots=#EBEDF0,#C6DAFC,#8AB4F8,#4285F4,#1A73E8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FBBC05&color_dots=#161B22,#174EA6,#1A73E8,#4285F4,#8AB4F8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
